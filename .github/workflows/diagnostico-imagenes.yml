name: Diagnóstico de imágenes

on:
  workflow_dispatch:
    inputs:
      muestra:
        description: "Cantidad de productos a probar"
        required: false
        default: "300"

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probar fuentes de imágenes
        env:
          MUESTRA: ${{ github.event.inputs.muestra }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/diagnostico_imagenes.py

      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/diagnostico-imagenes.txt
          git diff --cached --quiet || { git commit -m "Diagnóstico de imágenes"; git pull --rebase -q; git push; }
