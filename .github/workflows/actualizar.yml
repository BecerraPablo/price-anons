name: Actualizar precios

on:
  schedule:
    # El portal publica el archivo del día cerca de las 16:20 (hora Argentina).
    # Corre 19:47 y 22:47 hora Argentina; la segunda cubre días en que se atrasa o falla.
    - cron: "47 22 * * *"
    - cron: "47 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Descargar SEPA y filtrar sucursal
        env:
          CADENA: ${{ secrets.CADENA }}
          LOCALIDAD: ${{ secrets.LOCALIDAD }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python scripts/actualizar.py 2>&1 | tee docs/data/ultimo-log.txt

      - name: Buscar fotos de productos
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          echo "" >> docs/data/ultimo-log.txt
          python scripts/imagenes.py 2>&1 | tee -a docs/data/ultimo-log.txt

      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios $(TZ=America/Argentina/Buenos_Aires date +%F)"
            git push
          fi
