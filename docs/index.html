<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Price Anon</title>
<meta name="theme-color" content="#1f6b3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra de búsqueda fija arriba, grilla de tarjetas tipo etiqueta de góndola, ficha en hoja inferior */
:root{
  --bg:#eef1ed; --fg:#16201a; --muted:#5b6a60; --card:#ffffff; --line:#d3dcd5;
  --accent:#1f6b3a; --accent-fg:#ffffff; --tag:#ffe45c; --tag-fg:#1b1a12; --promo:#b3261e;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101612; --fg:#e4ebe6; --muted:#93a399; --card:#19211c; --line:#2b3730;
  --accent:#6fcf8f; --accent-fg:#0d1a12; --tag:#e8cf45; --tag-fg:#17160c; --promo:#ff8a80;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.4;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;flex-direction:column;gap:10px;padding-block:14px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.meta{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:12px 40px 12px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--muted);font-size:1.3rem;cursor:pointer;padding:6px 8px;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--card);color:var(--fg);
  padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

main .wrap{padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
.count{font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .img{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px}
.card img{max-width:100%;max-height:100%;object-fit:contain}
.card .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .desc{font-size:.85rem;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{font-size:.75rem;color:var(--muted)}
.price{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.card .price{margin-top:auto;align-self:flex-start;background:var(--tag);color:var(--tag-fg);padding:2px 8px;border-radius:4px;font-size:1rem}
.card .promo{font-size:.7rem;color:var(--promo);font-weight:600}
.ph{width:56%;height:56%;color:#b9c4bc}
.more{align-self:center;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 18px;border-radius:8px;cursor:pointer}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h2{margin:0;font-size:1.05rem}
.empty p{margin:0;color:var(--muted)}

dialog{border:0;padding:0;background:var(--card);color:var(--fg);width:min(560px,100%);max-height:92vh;
  border-radius:16px 16px 0 0;margin:auto auto 0;overflow:auto}
@media (min-width:640px){dialog{border-radius:16px;margin:auto}}
dialog::backdrop{background:rgba(10,16,12,.55)}
.sheet{display:flex;flex-direction:column;gap:14px;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .head{display:flex;gap:14px;align-items:flex-start}
.sheet .head .img{width:96px;height:96px;flex:none;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:6px;border:1px solid var(--line)}
.sheet .head img{max-width:100%;max-height:100%;object-fit:contain}
.sheet h2{margin:0;font-size:1.05rem;line-height:1.3;text-wrap:balance}
.sheet .close{margin-left:auto;border:0;background:none;color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1;padding:2px 6px}
.bigprice{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bigprice .price{font-size:2rem;background:var(--tag);color:var(--tag-fg);padding:2px 12px;border-radius:6px}
.bigprice .ref{font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.promos{display:flex;flex-direction:column;gap:4px}
.promos div{font-size:.85rem;color:var(--promo);font-weight:600}
.barcode{background:#fff;border-radius:10px;padding:14px 8px;display:flex;justify-content:center;border:1px solid var(--line)}
.barcode svg{max-width:100%;height:auto}
.eanrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.eanrow code{font-family:var(--mono);font-size:1.05rem;letter-spacing:.06em}
.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer}
.hist h3{margin:0 0 6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hist svg{width:100%;height:auto;display:block}
.hist .note{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.notfound{font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:active{transform:scale(.98)}}

/* favoritos y lista */
.card{position:relative}
.badges{position:absolute;top:6px;right:6px;display:flex;gap:4px;pointer-events:none}
.badge{font-family:var(--mono);font-size:.7rem;font-weight:600;padding:2px 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg)}
.badge.star{background:var(--tag);color:var(--tag-fg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--tag);color:var(--tag-fg);border-color:var(--tag)}
body.con-barra main .wrap{padding-bottom:96px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--accent);color:var(--accent-fg);border:0;font:inherit;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .price{font-size:1.1rem}
.lista{display:flex;flex-direction:column;gap:10px}
.li{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li .nom{font-size:.85rem;font-weight:600;line-height:1.25;min-width:0}
.li .nom small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.li .sub{font-family:var(--mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.li .ctrls{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:2px}
.fld span{font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input{font:inherit;font-family:var(--mono);font-size:.95rem;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.fld input.edit{border-color:var(--promo)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{font:inherit;width:34px;height:34px;border:0;background:var(--bg);color:var(--fg);font-size:1.1rem;cursor:pointer}
.qty input{width:52px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;padding:7px 2px}
.w-pct{width:70px}.w-pr{width:120px}
.rm{margin-left:auto;border:0;background:none;color:var(--muted);font:inherit;font-size:.8rem;cursor:pointer;padding:8px 4px;text-decoration:underline}
.tot{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.tot .row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tot .row.big{font-size:1.25rem;font-weight:600}
.tot .row .fld{flex-direction:row;align-items:center;gap:8px}
.tot .row .fld input{width:90px}
.tot .row .fld input#tpresu{width:130px}
.ok{color:var(--accent)} .mal{color:var(--promo)}
.manual{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.manual .fld:first-child{flex:1;min-width:140px}
.aviso{font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Price Anon</h1>
      <span class="meta" id="meta">Cargando datos…</span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Producto, código de barras o $monto" autocomplete="off" enterkeyhint="search" aria-label="Buscar producto o código">
      <button id="clear" aria-label="Borrar búsqueda" hidden>×</button>
    </div>
    <div class="chips">
      <button class="chip" id="favf" aria-pressed="false">★ Favoritos</button>
      <button class="chip" id="share">Pasar a otro dispositivo</button>
    </div>
    <div class="chips" id="sucs" hidden></div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" hidden>Mostrar más</button>
    <div id="empty" hidden></div>
  </div>
</main>

<button class="bar" id="bar" hidden></button>

<dialog id="dlg" aria-labelledby="dtitle">
  <div class="sheet" id="sheet"></div>
</dialog>

<script src="vendor/JsBarcode.all.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const fmt = new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:2});
const PAGE = 60;
let DATA = null, ITEMS = [], HIST = null, results = [], shown = 0, sucActiva = null;

const norm = t => (t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
/* clave de búsqueda tolerante: sin letras dobles, muzza = mozza, v = b, sin h inicial */
const fold = t => norm(t).replace(/([a-z])\1+/g,'$1').replace(/muz/g,'moz').replace(/v/g,'b').replace(/\bh/g,'');
const esc = t => String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PH = '<svg class="ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>';

/* ---------- imágenes por EAN (enlaces que busca el script diario) ---------- */
let IMGS = null;
const loadImgs = fetch('data/imagenes.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{IMGS=j}).catch(()=>{});
function imgURL(ean){
  if(!IMGS) return `https://imagenes.preciosclaros.gob.ar/productos/${ean}.jpg`;
  const v = IMGS.i?.[ean];
  return v ? IMGS.p[v[0]] + v[1] : '';
}
function imgHTML(ean){
  const url = imgURL(ean);
  return url ? `<img loading="lazy" alt="" src="${esc(url)}" onerror="imgFail(this)">` : PH;
}
window.imgFail = img => img.replaceWith(phNode());
function phNode(){const d=document.createElement('span');d.innerHTML=PH;return d.firstChild}

/* ---------- favoritos y lista (se guardan en este navegador) ---------- */
function leer(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v??def}catch{return def}}
function guardar(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
let FAVS = new Set(leer('pa-favs',[]));
let LISTA = leer('pa-lista',{items:[],desc:'',presu:''});
let soloFavs = false, favsCambiaron = false;
const saveFavs = ()=>guardar('pa-favs',[...FAVS]);
const saveLista = ()=>{guardar('pa-lista',LISTA);pintarBarra()};
const byEan = e => ITEMS.find(x=>x.e===e && (!sucActiva||x.s===sucActiva)) || ITEMS.find(x=>x.e===e);
const num = v => { const n=parseFloat(String(v??'').replace(/\./g,'').replace(',','.')); return isNaN(n)?null:n };
const enLista = e => LISTA.items.find(i=>i.e===e);

function precioItem(it){
  const p = it.e ? byEan(it.e) : null;
  const base = num(it.pr) ?? p?.p ?? it.u ?? 0;
  return {p, base, editado: num(it.pr)!=null};
}
function subtotal(it){
  const {base} = precioItem(it);
  const q = num(it.n) ?? 1, d = num(it.d) ?? 0;
  return base * q * (1 - d/100);
}
function totales(){
  const sub = LISTA.items.reduce((a,it)=>a+subtotal(it),0);
  const g = num(LISTA.desc) ?? 0;
  return {sub, total: sub*(1-g/100)};
}
function pintarBarra(){
  const n = LISTA.items.length;
  $('#bar').hidden = n===0;
  document.body.classList.toggle('con-barra', n>0);
  if(!n) return;
  const {total} = totales();
  const pr = num(LISTA.presu);
  const resto = pr!=null ? ` · ${pr-total>=0?'quedan':'te pasás'} ${fmt.format(Math.abs(pr-total))}` : '';
  $('#bar').innerHTML = `<span>Lista · ${n} producto${n===1?'':'s'}${resto}</span><span class="price">${fmt.format(total)}</span>`;
}
function agregar(p){
  const it = enLista(p.e);
  if(it) it.n = (num(it.n)??1)+1;
  else LISTA.items.push({e:p.e, n:1, d:'', pr:'', u:p.p});
  saveLista();
}
function quitar(e){ LISTA.items = LISTA.items.filter(i=>i.e!==e && i.id!==e); saveLista(); }

/* ---------- datos ---------- */
async function load(){
  try{
    const r = await fetch('data/productos.json',{cache:'no-cache'});
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
    await loadImgs;
  }catch(e){
    $('#meta').textContent = 'Sin datos';
    showEmpty('Todavía no hay datos',
      'La primera actualización se genera desde GitHub Actions (workflow "Actualizar precios"). Cuando termine, recargá esta página.');
    return;
  }
  ITEMS = DATA.productos.map(p => ({...p,
    k: fold(`${p.d} ${p.m} ${p.q}`)+' '+p.e,
    /* mismo producto en otra presentación: descripción sin la cantidad final ("…, 500 gr") */
    g: fold(p.d.replace(/,\s*[\d.,]+\s*[a-z0-9]+\.?\s*$/i,''))}));
  const f = DATA.fecha ? new Date(DATA.fecha+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}) : '';
  $('#meta').textContent = `Datos SEPA del ${f}`;
  if(DATA.sucursales?.length>1){
    sucActiva = DATA.sucursales[0].id;
    $('#sucs').hidden = false;
    $('#sucs').innerHTML = DATA.sucursales.map(s=>`<button class="chip" data-s="${esc(s.id)}" aria-pressed="${s.id===sucActiva}">Sucursal ${esc(s.id)}</button>`).join('');
    $('#sucs').onclick = e=>{const b=e.target.closest('.chip');if(!b)return;sucActiva=b.dataset.s;
      document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.s===sucActiva));search()};
  }
  search();
  pintarBarra();
  if(location.hash.startsWith('#s=')) ofrecerImportar(location.hash.slice(3));
  else if(location.hash.length>1) openByEan(location.hash.slice(1));
}

/* ---------- búsqueda ---------- */
function search(mantenerScroll){
  const raw = $('#q').value.trim();
  $('#clear').hidden = !raw;
  let pool = sucActiva ? ITEMS.filter(p=>p.s===sucActiva) : ITEMS;
  if(soloFavs) pool = pool.filter(p=>FAVS.has(p.e));
  $('#empty').hidden = true;
  if(mantenerScroll!==true) window.scrollTo({top:0});

  /* "$300" = todo lo que vale hasta ese monto, del más caro al más barato */
  const m = raw.match(/\$\s*([\d.,]+)/);
  const tope = m ? parseFloat(m[1].replace(/\./g,'').replace(',','.')) : null;
  const q = norm(m ? raw.replace(m[0],' ').trim() : raw);

  const digits = /^\d+$/.test(q);
  if(!q) results = pool;
  else if(digits && tope==null){
    results = pool.filter(p=>p.e.includes(q));
    if(results.length===0 && [8,12,13].includes(q.length)) return showNotFound(q);
  } else {
    const toks = fold(q).split(/\s+/).filter(Boolean).map(t=>t.length>3&&t.endsWith('s')?t.slice(0,-1):t);
    results = pool.filter(p=>toks.every(t=>p.k.includes(t)));
  }

  if(tope!=null && !isNaN(tope)){
    results = results.filter(p=>p.p<=tope).sort((a,b)=>b.p-a.p);
    $('#count').textContent = `${results.length} producto${results.length===1?'':'s'} hasta ${fmt.format(tope)}`;
  } else {
    $('#count').textContent = q ? `${results.length} resultado${results.length===1?'':'s'}` : `${pool.length} producto${pool.length===1?'':'s'}`;
    results = ordenar(results);
  }
  $('#grid').innerHTML=''; shown=0; more();
  if(soloFavs && pool.length===0) showEmpty('Todavía no marcaste favoritos','Abrí un producto y tocá "★ Favorito" para tenerlo a mano acá.');
  else if(raw && results.length===0) showEmpty('Sin resultados', tope!=null ? 'No hay productos hasta ese monto con esas palabras.' : 'Probá con menos palabras o con la marca.');
}
/* de menor a mayor precio, con las presentaciones del mismo producto juntas */
function ordenar(lista){
  const grupos = new Map();
  for(const p of lista){ if(!grupos.has(p.g)) grupos.set(p.g, []); grupos.get(p.g).push(p); }
  const arr = [...grupos.values()];
  arr.forEach(g=>g.sort((a,b)=>a.p-b.p));
  arr.sort((a,b)=>a[0].p-b[0].p || a[0].d.localeCompare(b[0].d));
  return arr.flat();
}
function more(){
  const slice = results.slice(shown, shown+PAGE);
  $('#grid').insertAdjacentHTML('beforeend', slice.map(cardHTML).join(''));
  shown += slice.length;
  $('#more').hidden = shown>=results.length;
}
function cardHTML(p){
  const promo = p.o?.length ? `<span class="promo">Promo${p.o[0][0]?' '+fmt.format(p.o[0][0]):''}</span>` : '';
  const it = enLista(p.e);
  const badges = (FAVS.has(p.e)?'<span class="badge star">★</span>':'') + (it?`<span class="badge">×${esc(it.n)}</span>`:'');
  return `<button class="card" data-e="${p.e}" data-s="${esc(p.s)}">
    <div class="badges">${badges}</div>
    <div class="img">${imgHTML(p.e)}</div>
    <div class="body">
      <div class="desc">${esc(p.d)}</div>
      <div class="sub">${esc([p.m,p.q].filter(Boolean).join(' · '))}</div>
      ${promo}
      <span class="price">${fmt.format(p.p)}</span>
    </div></button>`;
}
function showEmpty(t,m){
  $('#empty').hidden=false;
  $('#empty').innerHTML=`<div class="empty"><h2>${esc(t)}</h2><p>${esc(m)}</p></div>`;
}
function showNotFound(code){
  $('#count').textContent='';
  $('#grid').innerHTML=''; $('#more').hidden=true;
  $('#empty').hidden=false;
  $('#empty').innerHTML=`<div class="empty"><h2>El código ${esc(code)} no está en la base</h2>
    <p>Puede que la sucursal no lo informe a SEPA. Igual podés ver el código de barras.</p>
    <button class="btn" id="showbc">Ver código de barras</button></div>`;
  $('#showbc').onclick=()=>openDetail({e:code.padStart(13,'0'),d:'Código ingresado a mano',m:'',q:'',p:null});
}

/* ---------- ficha ---------- */
function openByEan(code){
  const c = code.replace(/\D/g,'');
  const p = ITEMS.find(x=>x.e===c.padStart(13,'0') && (!sucActiva||x.s===sucActiva));
  if(p) openDetail(p);
}
function openDetail(p){
  const ref = p.r ? `<span class="ref">${fmt.format(p.r[0])} x ${esc(p.r[1]||'')} ${esc(p.r[2]||'')}</span>` : '';
  const promos = p.o?.length ? `<div class="promos">${p.o.map(o=>`<div>${o[0]?fmt.format(o[0])+' · ':''}${esc(o[1]||'')}</div>`).join('')}</div>` : '';
  $('#sheet').innerHTML = `
    <div class="head">
      <div class="img">${imgHTML(p.e)}</div>
      <div style="min-width:0;display:flex;flex-direction:column;gap:4px">
        <h2 id="dtitle">${esc(p.d)}</h2>
        <div class="sub" style="color:var(--muted);font-size:.85rem">${esc([p.m,p.q].filter(Boolean).join(' · '))}</div>
      </div>
      <button class="close" aria-label="Cerrar">×</button>
    </div>
    ${p.p!=null?`<div class="bigprice"><span class="price">${fmt.format(p.p)}</span>${ref}</div>`:''}
    ${promos}
    ${p.p!=null?`<div class="actions">
      <button class="btn primary" id="addl">${enLista(p.e)?'Sumar 1 más a la lista':'Agregar a la lista'}</button>
      <button class="btn" id="fav" aria-pressed="${FAVS.has(p.e)}">★ Favorito</button>
    </div>`:''}
    <div class="barcode"><svg id="bc"></svg></div>
    <div class="eanrow"><code>${p.e}</code><button class="btn" id="copy">Copiar código</button></div>
    ${p.p!=null?'<div class="hist" id="hist"></div>':''}`;
  try{
    const isEan13 = p.e.length===13;
    JsBarcode('#bc', p.e, {format:isEan13?'EAN13':'CODE128',width:2.4,height:110,fontSize:20,background:'#ffffff',lineColor:'#000000',margin:12});
  }catch{ $('#bc').outerHTML = '<p class="notfound">No se pudo dibujar este código.</p>'; }
  $('.sheet .close').onclick=()=>$('#dlg').close();
  if($('#addl')) $('#addl').onclick=e=>{agregar(p);const it=enLista(p.e);e.target.textContent=`En la lista (×${it.n}) · sumar 1 más`;refrescarTarjeta(p.e)};
  if($('#fav')) $('#fav').onclick=e=>{FAVS.has(p.e)?FAVS.delete(p.e):FAVS.add(p.e);saveFavs();favsCambiaron=true;e.target.setAttribute('aria-pressed',FAVS.has(p.e));refrescarTarjeta(p.e)};
  $('#copy').onclick=async e=>{
    try{await navigator.clipboard.writeText(p.e);e.target.textContent='Copiado'}catch{e.target.textContent='No se pudo copiar'}
  };
  if(!$('#dlg').open) $('#dlg').showModal();
  history.replaceState(null,'','#'+p.e);
  if(p.p!=null) drawHistory(p);
}
$('#dlg').addEventListener('close',()=>{
  history.replaceState(null,'',location.pathname);
  // viendo solo favoritos: al quitar uno, sacarlo de la grilla sin recargar ni perder la posición
  if(soloFavs && favsCambiaron) search(true);
  favsCambiaron = false;
});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))$('#dlg').close()});

async function drawHistory(p){
  const box = $('#hist'); if(!box) return;
  if(!HIST){
    try{HIST = await (await fetch('data/historial.json',{cache:'no-cache'})).json()}catch{HIST={}}
  }
  const serie = (HIST[`${p.s}-${p.e}`]||[]).slice();
  if(serie.length<2){
    box.innerHTML = `<h3>Historial</h3><div class="note">${serie.length?'Sin cambios de precio desde '+serie[0][0]:'Sin historial todavía'}</div>`;
    return;
  }
  // extender hasta hoy con el último precio
  if(DATA?.fecha && serie[serie.length-1][0]!==DATA.fecha) serie.push([DATA.fecha, serie[serie.length-1][1]]);
  const W=520,H=150,pl=8,pr=8,pt=14,pb=22;
  const t = serie.map(s=>new Date(s[0]+'T12:00:00').getTime());
  const v = serie.map(s=>s[1]);
  const t0=t[0],t1=t[t.length-1]||t0+1, vmin=Math.min(...v), vmax=Math.max(...v), span=(vmax-vmin)||vmax*0.1||1;
  const X=x=>pl+(W-pl-pr)*((x-t0)/((t1-t0)||1)), Y=y=>pt+(H-pt-pb)*(1-(y-(vmin-span*.1))/(span*1.2));
  let d=''; serie.forEach((s,i)=>{const x=X(t[i]),y=Y(v[i]); d+= i? `H${x.toFixed(1)}V${y.toFixed(1)}`:`M${x.toFixed(1)},${y.toFixed(1)}`});
  const area = d+`V${H-pb}H${X(t0).toFixed(1)}Z`;
  const lx=X(t[t.length-1]), ly=Y(v[v.length-1]);
  const fd = s=>new Date(s+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'});
  const diff = v[v.length-1]-v[0], pct = v[0]?(diff/v[0]*100):0;
  box.innerHTML = `<h3>Historial</h3>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del precio">
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${lx}" cy="${ly}" r="4" fill="var(--accent)"/>
    <text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fd(serie[0][0])}</text>
    <text x="${W-pr}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end" font-family="IBM Plex Mono,monospace">${fd(serie[serie.length-1][0])}</text>
  </svg>
  <div class="note">${fmt.format(v[0])} → ${fmt.format(v[v.length-1])} (${diff>=0?'+':''}${pct.toFixed(1)}%) · ${serie.length-1} cambio${serie.length-1===1?'':'s'}</div>`;
}

function refrescarTarjeta(e){
  document.querySelectorAll(`.card[data-e="${e}"]`).forEach(c=>{
    const p=ITEMS.find(x=>x.e===e && x.s===c.dataset.s); if(p) c.outerHTML=cardHTML(p);
  });
}

/* ---------- hoja de la lista de compras ---------- */
function abrirLista(){
  const filas = LISTA.items.map((it,i)=>{
    const {p, base, editado} = precioItem(it);
    const nombre = it.e ? (p?.d || 'Producto que ya no figura en la base') : it.nom;
    const det = it.e ? `${fmt.format(p?.p ?? it.u ?? 0)} c/u${p?'':' (último precio conocido)'}` : 'Agregado a mano';
    return `<div class="li" data-i="${i}">
      <div class="nom">${esc(nombre)}<small>${esc(det)}</small></div>
      <div class="sub" data-sub>${fmt.format(subtotal(it))}</div>
      <div class="ctrls">
        <div class="fld"><span>Cantidad</span>
          <div class="qty"><button data-a="menos" aria-label="Uno menos">−</button><input data-k="n" inputmode="decimal" value="${esc(it.n)}" aria-label="Cantidad"><button data-a="mas" aria-label="Uno más">+</button></div></div>
        <label class="fld w-pct"><span>% desc.</span><input data-k="d" inputmode="decimal" placeholder="0" value="${esc(it.d)}"></label>
        <label class="fld w-pr"><span>Precio c/u</span><input data-k="pr" inputmode="decimal" placeholder="${esc(fmt.format(it.e?(p?.p ?? it.u ?? 0):0).replace(/\s/g,''))}" value="${esc(it.pr)}" class="${editado&&it.e?'edit':''}"></label>
        <button class="rm" data-a="rm">Quitar</button>
      </div></div>`;
  }).join('');
  $('#sheet').innerHTML = `
    <div class="head"><h2 id="dtitle">Lista de compras</h2><button class="close" aria-label="Cerrar">×</button></div>
    <div class="lista" id="lista">${filas || '<p class="aviso">La lista está vacía. Abrí un producto y tocá "Agregar a la lista".</p>'}</div>
    <div class="manual">
      <label class="fld"><span>Agregar a mano</span><input id="mnom" placeholder="Producto que no está en la base"></label>
      <label class="fld w-pr"><span>Precio</span><input id="mpr" inputmode="decimal" placeholder="$"></label>
      <button class="btn" id="madd">Agregar</button>
    </div>
    <div class="tot">
      <div class="row"><span>Subtotal</span><span id="tsub"></span></div>
      <div class="row"><label class="fld"><span>% desc. general</span><input id="tdesc" class="w-pct" inputmode="decimal" placeholder="0" value="${esc(LISTA.desc)}"></label><span id="tahorro" class="aviso"></span></div>
      <div class="row big"><span>Total</span><span id="ttot"></span></div>
      <div class="row"><label class="fld"><span>Presupuesto</span><input id="tpresu" class="w-pr" inputmode="decimal" placeholder="opcional" value="${esc(LISTA.presu)}"></label><span id="tresto"></span></div>
    </div>
    <p class="aviso">Los precios en rojo los editaste vos. Si dejás el campo vacío, se usa el precio de la base.</p>
    <div class="actions">
      <button class="btn" id="lshare">Pasar a otro dispositivo</button>
      <button class="btn" id="lvaciar">Vaciar lista</button>
    </div>`;
  pintarTotales();
  $('.sheet .close').onclick=()=>$('#dlg').close();
  const lista=$('#lista');
  lista.addEventListener('input',e=>{
    const inp=e.target.closest('input[data-k]'); if(!inp) return;
    const row=inp.closest('.li'), it=LISTA.items[+row.dataset.i];
    it[inp.dataset.k]=inp.value.trim();
    if(inp.dataset.k==='pr' && it.e) inp.classList.toggle('edit', num(inp.value)!=null);
    row.querySelector('[data-sub]').textContent=fmt.format(subtotal(it));
    saveLista(); pintarTotales();
  });
  lista.addEventListener('click',e=>{
    const b=e.target.closest('button[data-a]'); if(!b) return;
    const row=b.closest('.li'), it=LISTA.items[+row.dataset.i];
    if(b.dataset.a==='rm'){ LISTA.items.splice(+row.dataset.i,1); saveLista(); abrirLista(); if(it.e) refrescarTarjeta(it.e); return; }
    const q=Math.max(0,(num(it.n)??1)+(b.dataset.a==='mas'?1:-1));
    it.n = String(Math.round(q*1000)/1000);
    row.querySelector('input[data-k="n"]').value=it.n;
    row.querySelector('[data-sub]').textContent=fmt.format(subtotal(it));
    saveLista(); pintarTotales(); if(it.e) refrescarTarjeta(it.e);
  });
  $('#tdesc').oninput=e=>{LISTA.desc=e.target.value.trim();saveLista();pintarTotales()};
  $('#tpresu').oninput=e=>{LISTA.presu=e.target.value.trim();saveLista();pintarTotales()};
  $('#madd').onclick=()=>{
    const nom=$('#mnom').value.trim(), pr=num($('#mpr').value);
    if(!nom||pr==null){$('#mnom').focus();return}
    LISTA.items.push({id:'m'+Date.now(), nom, n:1, d:'', pr:String(pr)}); saveLista(); abrirLista();
  };
  $('#lshare').onclick=e=>compartir(e.target);
  $('#lvaciar').onclick=e=>{
    if(e.target.dataset.ok){ const es=LISTA.items.map(i=>i.e); LISTA.items=[]; saveLista(); abrirLista(); es.forEach(x=>x&&refrescarTarjeta(x)); }
    else { e.target.dataset.ok='1'; e.target.textContent='Tocá de nuevo para vaciar'; }
  };
  if(!$('#dlg').open) $('#dlg').showModal();
}
function pintarTotales(){
  const {sub,total}=totales(); const pr=num(LISTA.presu);
  $('#tsub').textContent=fmt.format(sub);
  $('#ttot').textContent=fmt.format(total);
  $('#tahorro').textContent = sub>total ? `ahorrás ${fmt.format(sub-total)}` : '';
  const r=$('#tresto');
  if(pr==null){r.textContent='';r.className=''}
  else if(pr>=total){r.textContent=`te quedan ${fmt.format(pr-total)}`;r.className='ok'}
  else {r.textContent=`te pasás por ${fmt.format(total-pr)}`;r.className='mal'}
}

/* ---------- pasar favoritos y lista a otro dispositivo (enlace) ---------- */
function codificar(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function decodificar(t){ t=t.replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(escape(atob(t)))); }
async function compartir(btn){
  const url = location.origin+location.pathname+'#s='+codificar({f:[...FAVS], l:LISTA});
  try{ await navigator.clipboard.writeText(url); btn.textContent='Enlace copiado: abrilo en el otro dispositivo'; }
  catch{ btn.textContent='Copiá este enlace:'; btn.insertAdjacentHTML('afterend',`<input class="fld" style="width:100%" readonly value="${esc(url)}" onclick="this.select()">`); }
}
function ofrecerImportar(t){
  let o; try{ o=decodificar(t) }catch{ history.replaceState(null,'',location.pathname); return; }
  const nf=(o.f||[]).length, nl=(o.l?.items||[]).length;
  $('#sheet').innerHTML=`
    <div class="head"><h2 id="dtitle">Traer datos de otro dispositivo</h2><button class="close" aria-label="Cerrar">×</button></div>
    <p>Este enlace trae <b>${nf} favorito${nf===1?'':'s'}</b> y una lista de <b>${nl} producto${nl===1?'':'s'}</b>.</p>
    <p class="aviso">Reemplaza los favoritos y la lista que tengas guardados en este navegador.</p>
    <div class="actions"><button class="btn primary" id="imp">Traer</button><button class="btn" id="noimp">Cancelar</button></div>`;
  const fin=()=>{history.replaceState(null,'',location.pathname);$('#dlg').close()};
  $('.sheet .close').onclick=fin; $('#noimp').onclick=fin;
  $('#imp').onclick=()=>{ FAVS=new Set(o.f||[]); saveFavs(); LISTA=Object.assign({items:[],desc:'',presu:''},o.l||{}); saveLista(); fin(); search(); };
  $('#dlg').showModal();
}

/* ---------- eventos ---------- */
$('#bar').onclick=abrirLista;
$('#favf').onclick=e=>{soloFavs=!soloFavs;favsCambiaron=false;e.target.setAttribute('aria-pressed',soloFavs);search()};
$('#share').onclick=e=>{compartir(e.target);setTimeout(()=>{e.target.textContent='Pasar a otro dispositivo'},4000)};
let tmr;
$('#q').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(search,90)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){
  e.preventDefault(); // si no, el mismo Enter activa el botón "cerrar" de la ficha recién abierta
  const q=$('#q').value.trim();
  if(/^\d{8,13}$/.test(q)) openByEan(q); else if(results.length===1) openDetail(results[0]);
}});
$('#clear').onclick=()=>{$('#q').value='';search();$('#q').focus()};
$('#more').onclick=more;
$('#grid').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c) return;
  const p=ITEMS.find(x=>x.e===c.dataset.e && x.s===c.dataset.s); if(p) openDetail(p);
});
load();
</script>
